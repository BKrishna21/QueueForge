version: "3.9"

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: queueforge-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: queueforge-grafana

    ports:
      - "3001:3000"

    restart: unless-stopped

    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: